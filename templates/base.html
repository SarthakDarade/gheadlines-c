<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/favicon.png">

    {{block "meta" .}}{{end}}

    <!-- Preconnect to CDN for performance -->
    <link rel="preconnect" href="https://cdn.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.cloudflare.com">
    <link rel="preconnect" href="https://images.unsplash.com">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['Georgia', 'Times New Roman', 'serif'],
                        'sans': ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        'news-blue': '#1e40af',
                        'news-red': '#dc2626',
                        'news-gray': '#1f2937',
                    }
                }
            }
        }
    </script>

    <!-- Minimal inline JS for real-time updates (Supabase Realtime) -->
    {{block "scripts" .}}{{end}}

    <!-- Minimal real-time updates using Server-Sent Events -->
    <script>
            (function () {
                // Only enable on homepage
                if (window.location.pathname === '/' || window.location.pathname === '') {
                    if (typeof EventSource !== 'undefined') {
                        try {
                            const eventSource = new EventSource('/api/realtime');
                            eventSource.onmessage = function (event) {
                                try {
                                    const data = JSON.parse(event.data);
                                    if (data.type === 'new_article' && data.article) {
                                        // Simple notification - page will refresh on next navigation
                                        console.log('New article:', data.article.title);
                                    }
                                } catch (e) { }
                            };
                            eventSource.onerror = function () {
                                eventSource.close();
                            };
                        } catch (e) {
                            // SSE not supported, silently fail
                        }
                    }
                }
            })();
    </script>

    <style>
        /* Custom styles for editorial design - NYTimes/BBC inspired */
        .article-content p {
            margin-bottom: 1.25rem;
            line-height: 1.75;
            font-size: 1.125rem;
            color: #1f2937;
        }

        .article-content h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
            color: #111827;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .article-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #1f2937;
        }

        .sticky-nav {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.98);
            transition: all 0.3s ease;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* Smooth transitions */
        * {
            transition-property: color, background-color, border-color, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }

        /* Focus styles for accessibility */
        a:focus,
        button:focus {
            outline: 2px solid #3B82F6;
            outline-offset: 2px;
        }
    </style>
</head>

<body class="bg-white text-gray-900 antialiased">
    {{template "header" .}}

    <main>
        {{block "content" .}}{{end}}
    </main>

    {{template "footer" .}}
</body>

</html>
