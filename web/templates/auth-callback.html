<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #003D6B 0%, #001F3F 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .loader {
            text-align: center;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .message {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="message">Completing sign in...</div>
    </div>

    <script>
        const supabaseUrl = '{{.SupabaseURL}}';
        const supabaseKey = '{{.SupabaseKey}}';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function handleCallback() {
            try {
                // Get the session from the URL hash
                const { data, error } = await supabase.auth.getSession();

                if (error) throw error;

                if (data.session) {
                    // Set the access token as a cookie
                    const maxAge = 7 * 24 * 60 * 60; // 7 days in seconds
                    const isSecure = window.location.protocol === 'https:';
                    document.cookie = `access_token=${data.session.access_token}; path=/; max-age=${maxAge}; SameSite=Lax${isSecure ? '; Secure' : ''}`;

                    // Redirect to home page
                    window.location.href = '/';
                } else {
                    throw new Error('No session found');
                }
            } catch (error) {
                console.error('Auth callback error:', error);
                document.getElementById('loader').innerHTML = `
                    <div class="error">
                        <h3>Authentication Error</h3>
                        <p>${error.message}</p>
                        <p><a href="/" style="color: #003D6B;">Return to homepage</a></p>
                    </div>
                `;
            }
        }

        // Run on page load
        handleCallback();
    </script>
</body>

</html>
